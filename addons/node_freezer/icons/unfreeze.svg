<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- Central filled circle -->
  <circle cx="8" cy="8" r="4.5" fill="#FF8C42"/>
  <!-- Eight radiating rays extending outward -->
  <g stroke="#FF8C42" stroke-width="2" stroke-linecap="round">
    <line x1="8" y1="0.5" x2="8" y2="2.5"/>
    <line x1="8" y1="13.5" x2="8" y2="15.5"/>
    <line x1="0.5" y1="8" x2="2.5" y2="8"/>
    <line x1="13.5" y1="8" x2="15.5" y2="8"/>
    <line x1="2.5" y1="2.5" x2="4.2" y2="4.2"/>
    <line x1="11.8" y1="11.8" x2="13.5" y2="13.5"/>
    <line x1="13.5" y1="2.5" x2="11.8" y2="4.2"/>
    <line x1="4.2" y1="11.8" x2="2.5" y2="13.5"/>
  </g>
</svg>