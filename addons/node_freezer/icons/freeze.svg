<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- Main axes extend to the edges -->
  <g stroke="#00E5FF" stroke-width="2" stroke-linecap="round" fill="none">
    <line x1="8" y1="0.5" x2="8" y2="15.5"/>
    <line x1="0.5" y1="8" x2="15.5" y2="8"/>
    <line x1="2.5" y1="2.5" x2="13.5" y2="13.5"/>
    <line x1="13.5" y1="2.5" x2="2.5" y2="13.5"/>
  </g>
  <!-- Central filled circle to reinforce visual focus -->
  <circle cx="8" cy="8" r="3.5" fill="#00E5FF"/>
</svg>